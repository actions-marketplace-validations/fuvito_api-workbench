name: 'Clear Signal — API Contract Validation'
description: 'Run API scenarios, validate spec conformance, or detect breaking changes with clrsig'
author: 'fuvito'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  command:
    description: 'Command to run: run | conform | diff | request | validate'
    required: true
    default: 'run'

  # --- run / validate ---
  scenario:
    description: 'Path to a scenario file, or for run a folder of scenarios (run, validate)'
    required: false

  # --- conform ---
  spec:
    description: 'Path or URL to OpenAPI spec (conform)'
    required: false

  # --- diff ---
  base-spec:
    description: 'Path or URL to the base (older) spec (diff)'
    required: false
  revision-spec:
    description: 'Path or URL to the revision (newer) spec (diff)'
    required: false

  # --- shared ---
  env:
    description: 'Path to environment YAML/JSON file for variable resolution'
    required: false
  base-url:
    description: 'Base URL to send requests to, overrides spec servers[] (conform)'
    required: false
  format:
    description: 'Output format: text | json | junit | html | markdown'
    required: false
    default: 'text'
  output:
    description: 'Write report to this file path'
    required: false
  fail-fast:
    description: 'Stop after the first failure (conform)'
    required: false
    default: 'false'
  coverage:
    description: 'Append an operation coverage summary (conform)'
    required: false
    default: 'false'
  breaking-only:
    description: 'Report only breaking changes (diff)'
    required: false
    default: 'false'
  fail-on:
    description: 'Fail when a change is at least this serious: breaking | warning | info (diff)'
    required: false
  against:
    description: 'Compare the spec in base-spec with the one at this git ref (diff; needs the full git history, so use fetch-depth: 0)'
    required: false
  strict:
    description: 'Also report valid but weak scenarios (steps that check nothing, extractions nobody uses) as warnings that fail the check (validate)'
    required: false
    default: 'false'
  setup:
    description: 'A scenario to run before the check, usually a login; what its steps extract is available to the generated requests as {{name}} (conform)'
    required: false
  conform-fail-on:
    description: 'failure (default) or warning: warnings fail the run only when this is warning (conform)'
    required: false
  read-only:
    description: 'Send only GET and HEAD requests; every other operation is skipped and never sent (conform)'
    required: false
    default: 'false'
  negative:
    description: 'Also run negative probes: drop required fields, wrong types, missing auth, missing parameters (conform)'
    required: false
    default: 'false'
  explain:
    description: 'Explain each failure in plain language in the text report (conform)'
    required: false
    default: 'false'
  baseline:
    description: 'Accept the violations recorded in this baseline file; only new violations fail the run (conform)'
    required: false
  write-baseline:
    description: 'Record the current violations in this file and succeed (conform)'
    required: false
  tags:
    description: 'Comma-separated OpenAPI tags to include (conform)'
    required: false
  paths:
    description: 'Comma-separated path prefixes to include (conform)'
    required: false
  request-timeout:
    description: 'Per-request timeout in milliseconds (conform)'
    required: false
  max-response-time:
    description: 'Fail an operation whose response takes longer than this many milliseconds; the response is still compared with the spec (conform)'
    required: false
  max-response-time-for:
    description: 'Different response-time limits for path prefixes, one /prefix=ms per line, for example /reports=2000; the longest prefix wins, 0 turns the limit off there (conform)'
    required: false
  var:
    description: 'Environment variable overrides, one name=value per line (run, conform). Do not put secrets here; use env: on the step and ${NAME} in the environment file'
    required: false
  report:
    description: 'Extra reports, one format=file per line, for example junit=reports/conform.xml (run, conform, diff)'
    required: false
  version:
    description: 'clrsig release tag to use, e.g. v1.2.0 (default: latest)'
    required: false
    default: 'latest'

outputs:
  result:
    description: 'Exit code of the clrsig command (0 = all checks passed)'
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: composite
  steps:
    - name: Install clrsig CLI
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        IN_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        VERSION="$IN_VERSION"

        # Resolve 'latest' to an actual tag via the GitHub API
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/fuvito/api-workbench/releases/latest" \
            | grep '"tag_name"' | head -1 | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
        fi

        # Map runner OS/arch to binary name
        OS="${RUNNER_OS,,}"   # lowercase: linux / macos / windows
        ARCH="${RUNNER_ARCH,,}"  # amd64 / arm64 / x86 / x64
        case "$ARCH" in
          x64)   ARCH=amd64  ;;
          x86)   ARCH=amd64  ;;
          arm64) ARCH=arm64  ;;
        esac
        case "$OS" in
          macos)   OS=darwin  ;;
          windows) OS=windows ;;
        esac

        # Not the workspace: a repository may have its own clrsig/ folder or file.
        BIN_DIR="$RUNNER_TEMP/clrsig-bin"
        mkdir -p "$BIN_DIR"

        if [ "$OS" = "windows" ]; then
          BINARY="clrsig-windows-${ARCH}.exe"
          DEST="$BIN_DIR/clrsig.exe"
        else
          BINARY="clrsig-${OS}-${ARCH}"
          DEST="$BIN_DIR/clrsig"
        fi

        URL="https://github.com/fuvito/api-workbench/releases/download/${VERSION}/${BINARY}"
        echo "Downloading ${BINARY} from ${VERSION}..."
        curl -fsSL -o "$DEST" "$URL"
        chmod +x "$DEST"

        echo "$BIN_DIR" >> "$GITHUB_PATH"
        echo "clrsig ${VERSION} installed."

    - name: Run clrsig
      id: run
      shell: bash
      # Inputs reach the script as environment variables, never pasted into it, so a value with
      # quotes or shell characters cannot change what runs.
      env:
        IN_COMMAND: ${{ inputs.command }}
        IN_SCENARIO: ${{ inputs.scenario }}
        IN_SPEC: ${{ inputs.spec }}
        IN_BASE_SPEC: ${{ inputs.base-spec }}
        IN_REVISION_SPEC: ${{ inputs.revision-spec }}
        IN_ENV: ${{ inputs.env }}
        IN_BASE_URL: ${{ inputs.base-url }}
        IN_FORMAT: ${{ inputs.format }}
        IN_OUTPUT: ${{ inputs.output }}
        IN_FAIL_FAST: ${{ inputs.fail-fast }}
        IN_COVERAGE: ${{ inputs.coverage }}
        IN_BREAKING_ONLY: ${{ inputs.breaking-only }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_AGAINST: ${{ inputs.against }}
        IN_READ_ONLY: ${{ inputs.read-only }}
        IN_CONFORM_FAIL_ON: ${{ inputs.conform-fail-on }}
        IN_SETUP: ${{ inputs.setup }}
        IN_STRICT: ${{ inputs.strict }}
        IN_NEGATIVE: ${{ inputs.negative }}
        IN_EXPLAIN: ${{ inputs.explain }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_WRITE_BASELINE: ${{ inputs.write-baseline }}
        IN_TAGS: ${{ inputs.tags }}
        IN_PATHS: ${{ inputs.paths }}
        IN_REQUEST_TIMEOUT: ${{ inputs.request-timeout }}
        IN_MAX_RESPONSE_TIME: ${{ inputs.max-response-time }}
        IN_MAX_RESPONSE_TIME_FOR: ${{ inputs.max-response-time-for }}
        IN_VAR: ${{ inputs.var }}
        IN_REPORT: ${{ inputs.report }}
      run: |
        set +e   # don't exit on failure; we capture the exit code

        CMD="$IN_COMMAND"
        ARGS=()

        # One value per line -> repeated flag (--var name=value, --report format=file)
        repeat() {
          local flag="$1" lines="$2" line
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [ -n "$line" ] && ARGS+=( "$flag" "$line" )
          done <<< "$lines"
        }

        case "$CMD" in
          run)
            [ -n "$IN_SCENARIO" ] && ARGS+=( "$IN_SCENARIO" )
            [ -n "$IN_ENV"    ] && ARGS+=( -e "$IN_ENV" )
            [ -n "$IN_FORMAT" ] && ARGS+=( -f "$IN_FORMAT" )
            [ -n "$IN_OUTPUT" ] && ARGS+=( -o "$IN_OUTPUT" )
            repeat --max-response-time-for "$IN_MAX_RESPONSE_TIME_FOR"
            repeat --var "$IN_VAR"
            repeat --report "$IN_REPORT"
            ;;
          conform)
            [ -n "$IN_SPEC" ] && ARGS+=( "$IN_SPEC" )
            [ -n "$IN_BASE_URL" ] && ARGS+=( -b "$IN_BASE_URL" )
            [ -n "$IN_ENV"      ] && ARGS+=( -e "$IN_ENV" )
            [ -n "$IN_FORMAT"   ] && ARGS+=( -f "$IN_FORMAT" )
            [ -n "$IN_OUTPUT"   ] && ARGS+=( -o "$IN_OUTPUT" )
            [ "$IN_FAIL_FAST" = "true" ] && ARGS+=( --fail-fast )
            [ "$IN_COVERAGE"  = "true" ] && ARGS+=( --coverage )
            [ "$IN_READ_ONLY" = "true" ] && ARGS+=( --read-only )
            [ -n "$IN_CONFORM_FAIL_ON" ] && ARGS+=( --fail-on "$IN_CONFORM_FAIL_ON" )
            [ -n "$IN_SETUP" ] && ARGS+=( --setup "$IN_SETUP" )
            [ "$IN_NEGATIVE"  = "true" ] && ARGS+=( --negative )
            [ "$IN_EXPLAIN"   = "true" ] && ARGS+=( --explain )
            [ -n "$IN_BASELINE"       ] && ARGS+=( --baseline "$IN_BASELINE" )
            [ -n "$IN_WRITE_BASELINE" ] && ARGS+=( --write-baseline "$IN_WRITE_BASELINE" )
            [ -n "$IN_TAGS"           ] && ARGS+=( --tags "$IN_TAGS" )
            [ -n "$IN_PATHS"          ] && ARGS+=( --paths "$IN_PATHS" )
            [ -n "$IN_REQUEST_TIMEOUT" ] && ARGS+=( --request-timeout "$IN_REQUEST_TIMEOUT" )
            [ -n "$IN_MAX_RESPONSE_TIME" ] && ARGS+=( --max-response-time "$IN_MAX_RESPONSE_TIME" )
            repeat --var "$IN_VAR"
            repeat --report "$IN_REPORT"
            ;;
          diff)
            if [ -n "$IN_AGAINST" ]; then
              ARGS+=( "$IN_BASE_SPEC" --against "$IN_AGAINST" )
            else
              ARGS+=( "$IN_BASE_SPEC" "$IN_REVISION_SPEC" )
            fi
            [ -n "$IN_FORMAT" ] && ARGS+=( -f "$IN_FORMAT" )
            [ -n "$IN_OUTPUT" ] && ARGS+=( -o "$IN_OUTPUT" )
            [ "$IN_BREAKING_ONLY" = "true" ] && ARGS+=( --breaking-only )
            [ -n "$IN_FAIL_ON" ] && ARGS+=( --fail-on "$IN_FAIL_ON" )
            repeat --report "$IN_REPORT"
            ;;
          validate)
            [ -n "$IN_SCENARIO" ] && ARGS+=( "$IN_SCENARIO" )
            [ "$IN_STRICT" = "true" ] && ARGS+=( --strict )
            [ "$IN_STRICT" = "true" ] && [ -n "$IN_ENV" ] && ARGS+=( -e "$IN_ENV" )
            [ -n "$IN_FORMAT" ] && ARGS+=( -f "$IN_FORMAT" )
            [ -n "$IN_OUTPUT" ] && ARGS+=( -o "$IN_OUTPUT" )
            ;;
          request)
            ARGS+=( "$IN_SCENARIO" )
            [ -n "$IN_ENV"    ] && ARGS+=( -e "$IN_ENV" )
            [ -n "$IN_FORMAT" ] && ARGS+=( -f "$IN_FORMAT" )
            ;;
          *)
            echo "::error::Unknown command '$CMD'. Use: run | conform | diff | request | validate"
            exit 2
            ;;
        esac

        clrsig "$CMD" "${ARGS[@]}"
        EXIT=$?
        echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
        exit $EXIT
