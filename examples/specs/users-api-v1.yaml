openapi: "3.0.3"
info:
  title: Users API
  version: "1.0.0"
  description: Version 1 — list and create users.

servers:
  - url: http://localhost:8080

paths:
  /users:
    get:
      operationId: listUsers
      summary: List all users
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      operationId: createUser
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:  { type: string }
                email: { type: string }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          description: Validation error

components:
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id:    { type: integer }
        name:  { type: string }
        email: { type: string }
