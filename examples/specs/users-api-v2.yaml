openapi: "3.0.3"
info:
  title: Users API
  version: "2.0.0"
  description: Version 2 — list users and fetch by ID. POST /users removed (breaking).

servers:
  - url: http://localhost:8080

paths:
  /users:
    get:
      operationId: listUsers
      summary: List all users
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The requested user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found

components:
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id:    { type: integer }
        name:  { type: string }
        email: { type: string }
