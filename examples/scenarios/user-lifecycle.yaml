schemaVersion: "1"
title: User lifecycle
description: Login, create a user, fetch it back, verify it, then delete it.

steps:
  - label: Login
    notes: "Obtain a bearer token. Subsequent steps depend on this — failPolicy stop is intentional."
    request:
      method: POST
      url: "{{baseUrl}}/auth/login"
      body:
        type: json
        content: '{"username":"{{username}}","password":"{{password}}"}'
    assertions:
      - type: status
        operator: eq
        expected: "200"
      - type: jsonpath
        path: "$.token"
        operator: ne
        expected: ""
    extractions:
      - name: token
        source: jsonpath
        path: "$.token"
    failPolicy: stop

  - label: Create user
    notes: "POST to /users with a fixed payload. Extracts the new user's ID for use in later steps."
    request:
      method: POST
      url: "{{baseUrl}}/users"
      headers:
        - name: Authorization
          value: "Bearer {{token}}"
      body:
        type: json
        content: '{"name":"Diana Prince","email":"diana@example.com"}'
    assertions:
      - type: status
        operator: eq
        expected: "201"
      - type: jsonpath
        path: "$.name"
        operator: eq
        expected: "Diana Prince"
      - type: jsonpath
        path: "$.id"
        operator: gt
        expected: "0"
    extractions:
      - name: userId
        source: jsonpath
        path: "$.id"
    failPolicy: stop

  - label: Fetch user
    notes: "Verify the user is readable immediately after creation."
    request:
      method: GET
      url: "{{baseUrl}}/users/{{userId}}"
      headers:
        - name: Authorization
          value: "Bearer {{token}}"
    assertions:
      - type: status
        operator: eq
        expected: "200"
      - type: jsonpath
        path: "$.name"
        operator: eq
        expected: "Diana Prince"
      - type: jsonpath
        path: "$.email"
        operator: eq
        expected: "diana@example.com"
    failPolicy: continue

  - label: Delete user
    notes: "Clean up — 204 No Content confirms the resource was removed."
    request:
      method: DELETE
      url: "{{baseUrl}}/users/{{userId}}"
      headers:
        - name: Authorization
          value: "Bearer {{token}}"
    assertions:
      - type: status
        operator: eq
        expected: "204"
