schemaVersion: "1"
title: RFC 7807 Problem Details conformance
description: >
  RFC 7807 defines application/problem+json as the standard format for HTTP
  error responses. Each error must carry type, title, status, and detail fields.
  Verify that 401, 404, and 422 responses all conform.

steps:
  - title: Unauthenticated request — 401 must be Problem Details
    request:
      method: GET
      url: "{{baseUrl}}/protected"
    assertions:
      - type: status
        operator: eq
        expected: "401"
      - type: header
        path: "Content-Type"
        operator: contains
        expected: "problem+json"
      - type: jsonpath
        path: "$.type"
        operator: ne
        expected: ""
      - type: jsonpath
        path: "$.title"
        operator: ne
        expected: ""
      - type: jsonpath
        path: "$.status"
        operator: eq
        expected: "401"
      - type: jsonpath
        path: "$.detail"
        operator: ne
        expected: ""
    failPolicy: continue

  - title: Non-existent user — 404 must be Problem Details
    request:
      method: GET
      url: "{{baseUrl}}/users/99999"
    assertions:
      - type: status
        operator: eq
        expected: "404"
      - type: header
        path: "Content-Type"
        operator: contains
        expected: "problem+json"
      - type: jsonpath
        path: "$.type"
        operator: ne
        expected: ""
      - type: jsonpath
        path: "$.title"
        operator: ne
        expected: ""
      - type: jsonpath
        path: "$.status"
        operator: eq
        expected: "404"
      - type: jsonpath
        path: "$.detail"
        operator: ne
        expected: ""
    failPolicy: continue

  - title: Create user with missing fields — 422 must be Problem Details
    request:
      method: POST
      url: "{{baseUrl}}/users"
      body:
        type: json
        content: '{"name":""}'
    assertions:
      - type: status
        operator: eq
        expected: "422"
      - type: header
        path: "Content-Type"
        operator: contains
        expected: "problem+json"
      - type: jsonpath
        path: "$.type"
        operator: ne
        expected: ""
      - type: jsonpath
        path: "$.title"
        operator: ne
        expected: ""
      - type: jsonpath
        path: "$.status"
        operator: eq
        expected: "422"
      - type: jsonpath
        path: "$.detail"
        operator: ne
        expected: ""
