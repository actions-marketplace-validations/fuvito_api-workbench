schemaVersion: "1"
name: Echo
description: The server reflects the request back as JSON — headers, query params, and body included. Useful for inspecting what gets sent.
method: POST
url: "{{baseUrl}}/echo"
queryParams:
  - name: debug
    value: "true"
headers:
  - name: X-Custom-Header
    value: hello-from-clrsig
body:
  type: json
  content: |
    {
      "message": "This request is reflected back to you",
      "variables": "{{baseUrl}}",
      "timestamp": "see it in the response"
    }
