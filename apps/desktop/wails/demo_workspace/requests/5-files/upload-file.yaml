schemaVersion: "1"
name: Upload File
description: Simulate a file upload by sending metadata (filename, MIME type, size). The server echoes the metadata back.
method: POST
url: "{{baseUrl}}/files/upload"
body:
  type: json
  content: |
    {
      "filename": "report.pdf",
      "mimeType": "application/pdf",
      "sizeBytes": 204800
    }
