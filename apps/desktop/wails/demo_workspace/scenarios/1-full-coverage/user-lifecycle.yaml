schemaVersion: "1"
title: User Lifecycle
description: Login, list users, create a new user, fetch and verify it, update it, then delete it.
specFile: "../../specs/openapi.yaml"

steps:
  - label: Login
    request:
      method: POST
      url: "{{baseUrl}}/auth/login"
      body:
        type: json
        content: '{"username":"admin","password":"secret"}'
    assertions:
      - type: status
        operator: eq
        expected: 200
    extractions:
      - name: authToken
        source: jsonpath
        path: "$.token"
    failPolicy: stop

  - label: List users
    notes: Confirm the users collection is non-empty before the CRUD steps.
    request:
      method: GET
      url: "{{baseUrl}}/users"
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.total"
        operator: gt
        expected: "0"
    failPolicy: continue

  - label: Create user
    request:
      method: POST
      url: "{{baseUrl}}/users"
      headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
      body:
        type: json
        content: '{"name":"Grace Hopper","email":"grace@example.com","role":"developer"}'
    assertions:
      - type: status
        operator: eq
        expected: 201
      - type: jsonpath
        path: "$.name"
        operator: eq
        expected: "Grace Hopper"
      - type: jsonpath
        path: "$.id"
        operator: gt
        expected: "0"
    extractions:
      - name: newUserId
        source: jsonpath
        path: "$.id"
    failPolicy: stop

  - label: Fetch user
    request:
      method: GET
      url: "{{baseUrl}}/users/{{newUserId}}"
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.name"
        operator: eq
        expected: "Grace Hopper"
      - type: jsonpath
        path: "$.email"
        operator: eq
        expected: "grace@example.com"
    failPolicy: continue

  - label: Update user
    request:
      method: PUT
      url: "{{baseUrl}}/users/{{newUserId}}"
      headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
      body:
        type: json
        content: '{"role":"senior-developer"}'
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.role"
        operator: eq
        expected: "senior-developer"
    failPolicy: continue

  - label: Delete user
    request:
      method: DELETE
      url: "{{baseUrl}}/users/{{newUserId}}"
      headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
    assertions:
      - type: status
        operator: eq
        expected: 204
    failPolicy: continue
