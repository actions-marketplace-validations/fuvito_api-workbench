schemaVersion: "1"
title: Health Check
description: Verify the server is running and returns expected health metadata.
specFile: "http://localhost:DEMO_PORT/openapi.yaml"

steps:
  - label: Check health endpoint
    request:
      method: GET
      url: "{{baseUrl}}/health"
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.status"
        operator: eq
        expected: ok
      - type: jsonpath
        path: "$.version"
        operator: ne
        expected: ""
