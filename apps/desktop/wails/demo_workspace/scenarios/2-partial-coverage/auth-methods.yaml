schemaVersion: "1"
title: Alternative Auth Methods
description: Basic auth and API key — both return 200 with the authenticated identity.
specFile: "../../specs/openapi.yaml"

steps:
  - label: Basic auth
    request:
      method: GET
      url: "{{baseUrl}}/auth/basic"
      auth:
        type: basic
        username: "{{basicUser}}"
        password: "{{basicPass}}"
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.message"
        operator: contains
        expected: "Authenticated"
    failPolicy: continue

  - label: API key
    request:
      method: GET
      url: "{{baseUrl}}/auth/apikey"
      auth:
        type: apikey
        key: X-Api-Key
        value: "{{apiKey}}"
        location: header
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.message"
        operator: contains
        expected: "accepted"
