schemaVersion: "1"
title: Create User — Wrong Status Expected
description: |
  Simulates a contract drift: the spec says POST /users returns 201 Created, but
  this scenario still expects 200 OK from an older version of the API. The name and
  ID assertions pass; the status assertion fails.
specFile: "../../specs/openapi.yaml"

steps:
  - label: Login
    request:
      method: POST
      url: "{{baseUrl}}/auth/login"
      body:
        type: json
        content: '{"username":"admin","password":"secret"}'
    assertions:
      - type: status
        operator: eq
        expected: 200
    extractions:
      - name: authToken
        source: jsonpath
        path: "$.token"
    failPolicy: stop

  - label: Create user (expects 200, gets 201)
    notes: status eq 200 will FAIL — the API returns 201 Created. The body assertions still pass.
    request:
      method: POST
      url: "{{baseUrl}}/users"
      headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
      body:
        type: json
        content: '{"name":"Marie Curie","email":"marie@example.com","role":"researcher"}'
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.name"
        operator: eq
        expected: "Marie Curie"
      - type: jsonpath
        path: "$.id"
        operator: gt
        expected: "0"
    extractions:
      - name: newUserId
        source: jsonpath
        path: "$.id"
    failPolicy: continue

  - label: Fetch created user
    notes: Runs despite the previous step failing (failPolicy continue). Should pass.
    request:
      method: GET
      url: "{{baseUrl}}/users/{{newUserId}}"
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.email"
        operator: eq
        expected: "marie@example.com"
    failPolicy: continue

  - label: Delete created user
    notes: Clean up — 204 No Content.
    request:
      method: DELETE
      url: "{{baseUrl}}/users/{{newUserId}}"
      headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
    assertions:
      - type: status
        operator: eq
        expected: 204
