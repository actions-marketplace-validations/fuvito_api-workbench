schemaVersion: "1"
title: Auth and Profile
description: Login and profile fetch — both pass. A clean baseline in an otherwise mixed folder.
specFile: "../../specs/openapi.yaml"

steps:
  - label: Login
    request:
      method: POST
      url: "{{baseUrl}}/auth/login"
      body:
        type: json
        content: '{"username":"admin","password":"secret"}'
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.token_type"
        operator: eq
        expected: "Bearer"
    extractions:
      - name: authToken
        source: jsonpath
        path: "$.token"
    failPolicy: stop

  - label: Get profile
    request:
      method: GET
      url: "{{baseUrl}}/auth/profile"
      headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.role"
        operator: eq
        expected: "admin"
