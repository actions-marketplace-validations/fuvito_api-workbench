schemaVersion: "1"
name: Paginated Users
description: Fetch two pages of users, verify pagination metadata, then look up a specific user by extracted ID.

steps:
  - name: List page 1 (limit 2)
    request:
      method: GET
      url: "{{baseUrl}}/users"
      queryParams:
        - name: page
          value: "1"
        - name: limit
          value: "2"
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.page"
        operator: eq
        expected: 1
      - type: jsonpath
        path: "$.total"
        operator: gt
        expected: 0
      - type: jsonpath
        path: "$.total_pages"
        operator: gt
        expected: 1
    extractions:
      - name: firstUserId
        source: jsonpath
        path: "$.data[0].id"

  - name: List page 2 (limit 2)
    request:
      method: GET
      url: "{{baseUrl}}/users"
      queryParams:
        - name: page
          value: "2"
        - name: limit
          value: "2"
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.page"
        operator: eq
        expected: 2
    failPolicy: continue

  - name: Fetch first user by extracted ID
    request:
      method: GET
      url: "{{baseUrl}}/users/{{firstUserId}}"
    assertions:
      - type: status
        operator: eq
        expected: 200
      - type: jsonpath
        path: "$.id"
        operator: gt
        expected: 0
      - type: jsonpath
        path: "$.name"
        operator: ne
        expected: ""
