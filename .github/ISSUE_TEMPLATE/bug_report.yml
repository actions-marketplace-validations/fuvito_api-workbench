name: Bug report
description: Something in the CLI, the desktop app or the GitHub Action does not work
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - CLI
        - Desktop app
        - GitHub Action
        - Docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The command (or the steps in the app) and the smallest files that show it. Remove tokens, passwords and private data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error message
      render: text
  - type: input
    id: version
    attributes:
      label: Version and system
      description: "clrsig --version (or Help, About), and the operating system"
    validations:
      required: true
