name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Core — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Test core
        run: go test -v ./...
        working-directory: packages/core

  cli-build:
    name: CLI — build
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Build CLI
        run: go build ./...
        working-directory: apps/cli

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Run integration tests
        run: go test -v ./...
        working-directory: examples/server

  desktop-build:
    name: Desktop — build
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Install frontend deps
        run: pnpm install
        working-directory: apps/desktop/frontend

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop/frontend

      - name: Build desktop Go
        run: go build ./...
        working-directory: apps/desktop/wails
