name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Core — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); exit 1; }

      - name: Vet core
        run: go vet ./...
        working-directory: packages/core

      - name: Test core
        run: go test -v ./...
        working-directory: packages/core

  cli-build:
    name: CLI — build and test
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Build CLI
        run: go build ./...
        working-directory: apps/cli

      - name: Vet CLI
        run: go vet ./...
        working-directory: apps/cli

      - name: Test CLI
        run: go test ./...
        working-directory: apps/cli

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Run integration tests
        run: go test -v ./...
        working-directory: examples/server

  desktop-build:
    name: Desktop — build
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Install frontend deps
        run: pnpm install
        working-directory: apps/desktop/frontend

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop/frontend

      - name: Build desktop Go
        run: go build ./...
        working-directory: apps/desktop/wails

      - name: Vet desktop Go
        run: go vet ./...
        working-directory: apps/desktop/wails

      - name: Test desktop Go
        run: go test ./...
        working-directory: apps/desktop/wails

      - name: Test frontend
        run: pnpm test
        working-directory: apps/desktop/frontend

  browser-tests:
    name: Desktop — browser tests
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install
        working-directory: apps/desktop/e2e

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/desktop/e2e

      - name: Browser tests against the mock bridge
        run: pnpm exec playwright test --project=frontend --grep-invert "smoke|@screenshot"
        working-directory: apps/desktop/e2e
        env:
          CI: 'true'

  quickstart:
    name: "60s quickstart (CI)"
    runs-on: ubuntu-latest
    needs: cli-build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Build clrsig
        run: go build -o /tmp/clrsig ./
        working-directory: apps/cli

      - name: Build and start example server
        timeout-minutes: 2
        run: |
          go build -o /tmp/example-server ./
          /tmp/example-server &
          for i in $(seq 1 50); do
            curl -sf http://localhost:8080/health && break
            [ $i -eq 50 ] && { echo "Server did not start"; exit 1; }
            sleep 0.2
          done
        working-directory: examples/server

      - name: "clrsig conform (must pass)"
        run: >
          /tmp/clrsig conform examples/server/openapi.yaml
          --base-url http://localhost:8080
          --env examples/environments/demo-conform.yaml

      - name: "clrsig run user-lifecycle (must pass)"
        run: >
          /tmp/clrsig run examples/scenarios/user-lifecycle.yaml
          --env examples/environments/local.yaml

      - name: "clrsig diff (must detect breaking changes)"
        run: |
          set +e
          /tmp/clrsig diff \
            examples/specs/users-api-v1.yaml \
            examples/specs/users-api-v2.yaml \
            --breaking-only
          test $? -eq 1
