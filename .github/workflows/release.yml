name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Desktop — Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        run: pnpm install
        working-directory: apps/desktop/frontend

      - name: Build desktop (Windows)
        run: wails build -platform windows/amd64
        working-directory: apps/desktop/wails

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: apidesk-windows-amd64
          path: apps/desktop/wails/build/bin/apidesk.exe

  release-macos:
    name: Desktop — macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        run: pnpm install
        working-directory: apps/desktop/frontend

      - name: Build desktop (macOS arm64)
        run: wails build -platform darwin/arm64
        working-directory: apps/desktop/wails

      - name: Build desktop (macOS amd64)
        run: wails build -platform darwin/amd64
        working-directory: apps/desktop/wails

      - name: Rename artifacts
        run: |
          mv apps/desktop/wails/build/bin/apidesk.app apps/desktop/wails/build/bin/apidesk-arm64.app || true
          cp apps/desktop/wails/build/bin/apidesk-arm64.app apps/desktop/wails/build/bin/apidesk-amd64.app || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: apidesk-macos
          path: apps/desktop/wails/build/bin/

  release-linux:
    name: Desktop — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        run: pnpm install
        working-directory: apps/desktop/frontend

      - name: Build desktop (Linux)
        run: wails build -platform linux/amd64
        working-directory: apps/desktop/wails

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: apidesk-linux-amd64
          path: apps/desktop/wails/build/bin/apidesk

  cli-binaries:
    name: CLI — all platforms
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: darwin
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: amd64
            suffix: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-X main.version=${{ github.ref_name }}" \
            -o apidesk-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./...
        working-directory: apps/cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: apidesk-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apps/cli/apidesk-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release-windows, release-macos, release-linux, cli-binaries]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ApiDesk ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/apidesk-windows-amd64/apidesk.exe
            dist/apidesk-linux-amd64/apidesk
            dist/apidesk-cli-windows-amd64/apidesk-windows-amd64.exe
            dist/apidesk-cli-darwin-arm64/apidesk-darwin-arm64
            dist/apidesk-cli-darwin-amd64/apidesk-darwin-amd64
            dist/apidesk-cli-linux-amd64/apidesk-linux-amd64
